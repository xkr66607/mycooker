<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小厨 · 私厨 AI 助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0a04b'/%3E%3Ctext y='.9em' x='50%25' text-anchor='middle' font-size='68'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   设计基调：暖炭黑 + 琥珀橙，像厨房里的暖光
   ============================================================ */
:root{
  --bg:#141210; --bg-2:#1b1815; --panel:#221e1a; --panel-2:#2a2521;
  --line:#332c26; --line-2:#443a31;
  --txt:#efe6dc; --txt-2:#b5a89a; --txt-3:#7d7266;
  --amber:#f0a04b; --amber-2:#e8894a; --amber-dim:#a3641f;
  --green:#7fbf7f; --red:#e06c5a; --blue:#6fa8d6;
  --radius:14px; --radius-s:9px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14.5px; line-height:1.65; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#5a4c40}

/* ===================== 布局 ===================== */
.app{display:flex;height:100vh;height:100dvh}

/* ===================== 侧栏 ===================== */
.sidebar{
  width:286px;flex-shrink:0;background:var(--bg-2);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:margin-left .25s ease;
}
.sidebar.collapsed{margin-left:-286px}
.brand{
  padding:18px 18px 14px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--line);
}
.brand .logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--amber),#c96a2a);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 14px rgba(240,160,75,.28);
}
.brand h1{font-size:15.5px;font-weight:650;letter-spacing:.3px}
.brand p{font-size:11.5px;color:var(--txt-3);margin-top:1px}

.newchat{
  margin:13px 14px;padding:9px 14px;border-radius:var(--radius-s);
  background:linear-gradient(135deg,rgba(240,160,75,.16),rgba(240,160,75,.06));
  border:1px solid rgba(240,160,75,.3);color:var(--amber);
  font-size:13.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .16s;
}
.newchat:hover{background:rgba(240,160,75,.2);border-color:var(--amber)}
.newchat:active{transform:scale(.98)}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 10px 12px}

.sec{margin-top:14px}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 6px 7px;font-size:11px;font-weight:650;
  letter-spacing:1.1px;text-transform:uppercase;color:var(--txt-3);
}
.sec-head .cnt{
  background:var(--panel-2);color:var(--txt-2);font-size:10.5px;
  padding:1px 7px;border-radius:20px;font-weight:600;letter-spacing:0;
}

.item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;
  border-radius:var(--radius-s);cursor:pointer;font-size:13px;
  color:var(--txt-2);transition:background .14s,color .14s;
  position:relative;
}
.item:hover{background:var(--panel);color:var(--txt)}
.item.active{background:rgba(240,160,75,.13);color:var(--amber)}
.item.active::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--amber);
}
.item .ico{font-size:13.5px;flex-shrink:0;width:15px;text-align:center;opacity:.85}
.item .txt{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.item .sub{font-size:10.5px;color:var(--txt-3);flex-shrink:0}
.item .del{
  opacity:0;flex-shrink:0;border:none;background:none;cursor:pointer;
  color:var(--txt-3);font-size:14px;padding:0 2px;transition:opacity .14s,color .14s;
}
.item:hover .del{opacity:1}
.item .del:hover{color:var(--red)}

.empty-note{
  padding:12px 10px;font-size:12px;color:var(--txt-3);
  text-align:center;line-height:1.7;
}

/* 上传区 */
.drop{
  margin:8px 4px 0;padding:16px 12px;border-radius:var(--radius-s);
  border:1.5px dashed var(--line-2);text-align:center;cursor:pointer;
  transition:all .16s;background:rgba(255,255,255,.012);
}
.drop:hover,.drop.over{
  border-color:var(--amber);background:rgba(240,160,75,.07);
}
.drop.over{border-style:solid}
.drop .big{font-size:19px;margin-bottom:3px;opacity:.75}
.drop .t{font-size:12px;color:var(--txt-2);font-weight:550}
.drop .s{font-size:10.5px;color:var(--txt-3);margin-top:3px}
.drop.busy{pointer-events:none;opacity:.6}

/* 底部状态 */
.sb-foot{
  border-top:1px solid var(--line);padding:11px 15px;
  font-size:11px;color:var(--txt-3);
  display:flex;align-items:center;gap:7px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.off{background:var(--red)}
.dot.busy{background:var(--amber);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===================== 主区 ===================== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

.topbar{
  height:53px;flex-shrink:0;display:flex;align-items:center;gap:11px;
  padding:0 18px;border-bottom:1px solid var(--line);
  background:rgba(20,18,16,.82);backdrop-filter:blur(12px);
}
.iconbtn{
  width:32px;height:32px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--txt-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all .14s;flex-shrink:0;
}
.iconbtn:hover{background:var(--panel);color:var(--txt)}
.topbar .title{
  font-size:13.5px;font-weight:600;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.badge{
  font-size:10.5px;padding:2.5px 9px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);
  color:var(--txt-2);white-space:nowrap;
}
.badge.ok{border-color:rgba(127,191,127,.35);color:var(--green)}

/* 顶栏的小标签：当前模型 / 配置提醒 */
.tag{
  font-size:10.5px;padding:2.5px 9px;border-radius:20px;
  white-space:nowrap;border:1px solid var(--line);
  background:var(--panel);color:var(--txt-2);cursor:default;
  max-width:260px;overflow:hidden;text-overflow:ellipsis;
}
.tag.model{border-color:rgba(240,160,75,.3);color:var(--amber)}
.tag.warn{border-color:rgba(226,120,110,.45);color:#e2786e;cursor:help}

/* 推理模型的思考中提示 */
.thinkingbar{
  display:flex;align-items:center;gap:8px;
  color:var(--txt-2);font-size:13px;padding:2px 0;
}
.thinkingbar .spinner{
  width:12px;height:12px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--amber);
  animation:spin .7s linear infinite;flex:0 0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.thinkingbar .dots::after{
  content:"";animation:dots 1.2s steps(4,end) infinite;
}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.thinkingbar .thinkcnt{
  margin-left:auto;font-size:11px;color:var(--txt-3, #7a736c);
  font-variant-numeric:tabular-nums;
}
@media(max-width:760px){
  .tag.model{display:none}
  .tag.warn{display:none}
}

/* 消息区 */
.msgs{flex:1;overflow-y:auto;padding:22px 0 8px;scroll-behavior:smooth}
.msgs-inner{max-width:830px;margin:0 auto;padding:0 22px}

.msg{display:flex;gap:11px;margin-bottom:22px;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:31px;height:31px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--panel-2);border:1px solid var(--line);
}
.msg.user .avatar{background:linear-gradient(135deg,#3f5a72,#2b3f52);border-color:#456}
.msg.ai .avatar{background:linear-gradient(135deg,var(--amber),#c96a2a);border-color:transparent}
.bubble-wrap{min-width:0;max-width:calc(100% - 44px)}

.bubble{
  padding:11px 15px;border-radius:var(--radius);
  word-break:break-word;overflow-wrap:break-word;
}
/* 有序列表编号用真实编号，嵌套列表收紧间距 */
.bubble ul,.bubble ol{margin:7px 0;padding-left:22px}
.bubble li>ul,.bubble li>ol{margin:3px 0 3px 0;padding-left:20px}
.bubble li>ul>li,.bubble li>ol>li{margin:2px 0;font-size:.96em;color:var(--txt-2)}
/* 有序列表编号用 CSS 计数器自己画，"1." 后面才会有确定的空格 */
.bubble ol{list-style:none;counter-reset:mdol;padding-left:27px}
.bubble ol>li{counter-increment:mdol;position:relative}
.bubble ol>li::before{
  content:counter(mdol) ".";
  position:absolute;left:-23px;width:19px;text-align:right;
  color:var(--amber);font-weight:650;font-variant-numeric:tabular-nums;
}
.msg.user .bubble{
  background:linear-gradient(135deg,#3c5063,#31424f);
  border:1px solid #45596b;border-top-right-radius:4px;
}
.msg.ai .bubble{
  background:var(--panel);border:1px solid var(--line);
  border-top-left-radius:4px;
}
.bubble.thinking{color:var(--txt-3);font-style:italic}

/* 消息内 markdown */
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
  margin:13px 0 7px;font-weight:650;line-height:1.35;color:var(--txt);
}
.bubble h1{font-size:17px}.bubble h2{font-size:16px}
.bubble h3{font-size:15px}.bubble h4{font-size:14px}
.bubble>*:first-child{margin-top:0}
.bubble>*:last-child{margin-bottom:0}
.bubble p{margin:7px 0}
.bubble ul,.bubble ol{margin:7px 0;padding-left:21px}
.bubble li{margin:3px 0}
.bubble li::marker{color:var(--amber-dim)}
.bubble strong{color:var(--amber);font-weight:650}
.bubble em{color:var(--txt-2)}
.bubble code{
  background:rgba(0,0,0,.42);padding:1.5px 5px;border-radius:4px;
  font-family:ui-monospace,Consolas,monospace;font-size:.9em;color:#e3b083;
  border:1px solid var(--line);
}
.bubble pre{
  background:#0d0b09;border:1px solid var(--line);border-radius:var(--radius-s);
  padding:11px 13px;margin:9px 0;overflow-x:auto;
}
.bubble pre code{background:none;border:none;padding:0;color:#d8cdc0;font-size:12.5px;line-height:1.6}
.bubble hr{border:none;border-top:1px solid var(--line);margin:13px 0}
.bubble a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(111,168,214,.35)}
.bubble a:hover{border-bottom-color:var(--blue)}
.bubble blockquote{
  border-left:3px solid var(--amber-dim);padding-left:11px;
  margin:9px 0;color:var(--txt-2);
}
.bubble table{border-collapse:collapse;margin:0;font-size:13px;width:100%}
.bubble th,.bubble td{border:1px solid var(--line-2);padding:5px 9px;text-align:left;vertical-align:top}
.bubble th{background:var(--panel-2);font-weight:600;white-space:nowrap}
.bubble .tbl{overflow-x:auto;margin:9px 0;-webkit-overflow-scrolling:touch}

/* 引用标记 [1] */
.cite{
  display:inline-block;min-width:16px;text-align:center;
  background:rgba(240,160,75,.16);color:var(--amber);
  border:1px solid rgba(240,160,75,.3);
  border-radius:4px;padding:0 3px;font-size:10.5px;
  font-weight:700;vertical-align:super;line-height:1.4;
  margin:0 1px;cursor:help;
}

/* 来源卡片 */
.sources{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.src{
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:8px 11px;
  font-size:12px;transition:border-color .15s;
}
.src:hover{border-color:var(--line-2)}
.src-head{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.src-idx{
  width:17px;height:17px;border-radius:4px;flex-shrink:0;
  background:rgba(240,160,75,.16);color:var(--amber);
  font-size:10.5px;font-weight:700;display:flex;
  align-items:center;justify-content:center;
}
.src-name{color:var(--txt-2);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.src-score{
  font-size:10.5px;color:var(--txt-3);font-variant-numeric:tabular-nums;flex-shrink:0;
}
.src-score.hi{color:var(--green)}
.src-score.mid{color:var(--amber)}
.src-prev{
  color:var(--txt-3);font-size:11.5px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.src-meta{font-size:10.5px;color:var(--txt-3);opacity:.8}

/* 食材识别标签 */
.ingredients{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ing{
  font-size:11.5px;padding:2px 9px;border-radius:20px;
  background:rgba(127,191,127,.12);border:1px solid rgba(127,191,127,.3);
  color:var(--green);
}

/* 空状态 */
.welcome{max-width:660px;margin:0 auto;padding:52px 22px 20px;text-align:center}
.welcome .hero{
  width:74px;height:74px;border-radius:22px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--amber),#c96a2a);
  display:flex;align-items:center;justify-content:center;font-size:36px;
  box-shadow:0 12px 40px rgba(240,160,75,.3);
}
.welcome h2{font-size:23px;font-weight:680;margin-bottom:9px;letter-spacing:.4px}
.welcome p{color:var(--txt-2);font-size:13.5px;max-width:470px;margin:0 auto 26px;line-height:1.75}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:560px;margin:0 auto}
.chip{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:12px 14px;cursor:pointer;
  text-align:left;transition:all .16s;
}
.chip:hover{border-color:var(--amber-dim);background:var(--panel-2);transform:translateY(-1px)}
.chip .q{font-size:13px;color:var(--txt);font-weight:550;margin-bottom:3px}
.chip .d{font-size:11.5px;color:var(--txt-3)}

/* ===================== 输入区 ===================== */
.composer-wrap{
  flex-shrink:0;padding:10px 22px 16px;
  background:linear-gradient(to top,var(--bg) 62%,transparent);
}
.composer{
  max-width:830px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line-2);border-radius:16px;
  transition:border-color .16s,box-shadow .16s;
  box-shadow:0 4px 20px rgba(0,0,0,.22);
}
.composer:focus-within{
  border-color:var(--amber-dim);
  box-shadow:0 4px 26px rgba(240,160,75,.14);
}
.composer.drag{border-color:var(--amber);background:rgba(240,160,75,.06)}

.img-preview{
  display:none;padding:10px 12px 0;position:relative;width:fit-content;
}
.img-preview.on{display:block}
.img-preview img{
  height:62px;border-radius:8px;border:1px solid var(--line-2);display:block;
}
.img-preview .rm{
  position:absolute;top:5px;right:-6px;width:19px;height:19px;
  border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--panel);
  cursor:pointer;font-size:11px;line-height:1;display:flex;
  align-items:center;justify-content:center;
}

textarea#input{
  width:100%;background:none;border:none;outline:none;color:var(--txt);
  font-family:inherit;font-size:14.5px;line-height:1.6;
  padding:14px 16px 6px;resize:none;max-height:190px;min-height:52px;
}
textarea#input::placeholder{color:var(--txt-3)}

.composer-bar{
  display:flex;align-items:center;gap:5px;padding:5px 10px 9px;
}
.composer-bar .spacer{flex:1}
.hint{font-size:11px;color:var(--txt-3);padding-right:6px}

.send{
  width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--amber),#c96a2a);color:#241505;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all .16s;flex-shrink:0;
}
.send:hover:not(:disabled){transform:scale(1.06);box-shadow:0 4px 16px rgba(240,160,75,.35)}
.send:disabled{opacity:.34;cursor:not-allowed;transform:none;box-shadow:none}
.send.stop{background:linear-gradient(135deg,var(--red),#b34f3f);color:#fff}

/* ===================== Toast ===================== */
.toasts{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;
}
.toast{
  background:var(--panel-2);border:1px solid var(--line-2);
  padding:9px 17px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow);animation:toastIn .22s ease;
  max-width:82vw;text-align:center;
}
.toast.ok{border-color:rgba(127,191,127,.42);color:var(--green)}
.toast.err{border-color:rgba(224,108,90,.42);color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

/* ===================== 移动端 ===================== */
.backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:40;backdrop-filter:blur(2px);
}
.backdrop.on{display:block}
@media(max-width:760px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:50;
    box-shadow:var(--shadow);margin-left:-286px;
  }
  .sidebar.open{margin-left:0}
  .msgs-inner{padding:0 14px}
  .composer-wrap{padding:8px 12px 12px}
  .chips{grid-template-columns:1fr}
  .welcome{padding:34px 16px 16px}
  .bubble-wrap{max-width:calc(100% - 34px)}
  .bubble table{font-size:12px}
  .bubble th,.bubble td{padding:4px 7px}
  .bubble h1{font-size:16px}
  .bubble h2{font-size:15px}
  .bubble h3{font-size:14.5px}
}
</style>
</head>
<body>

<div class="app">
  <!-- ==================== 侧栏 ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🍳</div>
      <div>
        <h1>小厨 · 私厨助手</h1>
        <p>RAG 知识库增强</p>
      </div>
    </div>

    <button class="newchat" id="btnNew">＋ 新建对话</button>

    <div class="sb-scroll">
      <!-- 对话历史 -->
      <div class="sec">
        <div class="sec-head">
          <span>对话历史</span>
          <span class="cnt" id="cntConv">0</span>
        </div>
        <div id="convList"></div>
      </div>

      <!-- 知识库 -->
      <div class="sec">
        <div class="sec-head">
          <span>知识库</span>
          <span class="cnt" id="cntDoc">0</span>
        </div>
        <div id="docList"></div>
        <div class="drop" id="drop">
          <div class="big">📄</div>
          <div class="t">点击或拖入文件</div>
          <div class="s">支持 TXT · MD · PDF · DOCX · CSV</div>
        </div>
        <input type="file" id="fileInput" hidden accept=".txt,.md,.markdown,.pdf,.docx,.csv,.json">
      </div>

      <!-- 长期记忆 -->
      <div class="sec">
        <div class="sec-head">
          <span>口味记忆</span>
          <span class="cnt" id="cntFact">0</span>
        </div>
        <div id="factList"></div>
      </div>
    </div>

    <div class="sb-foot">
      <span class="dot" id="statusDot"></span>
      <span id="statusTxt">连接中…</span>
    </div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <main class="main">
    <header class="topbar">
      <button class="iconbtn" id="btnMenu" title="菜单">☰</button>
      <div class="title" id="chatTitle">新对话</div>
      <span class="tag warn" id="warnTag" hidden>配置提醒</span>
      <span class="tag model" id="modelTag" hidden>模型</span>
      <span class="badge" id="kbBadge">知识库 0 条</span>
    </header>

<script>
/* ============================================================
   小厨前端 —— 无框架、无构建、零依赖
   ============================================================ */
(() => {
"use strict";

const API = "/api/v1";
const $  = (s) => document.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};

/* ---------------- 状态 ---------------- */
let WELCOME_HTML = "";

/* ---------------- 工具 ---------------- */
async function api(path, opts = {}) {
  const res = await fetch(API + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!res.ok) {
    const msg = (data && (data.detail || data.message)) || `HTTP ${res.status}`;
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  return data;
}

function toast(msg, type = "") {
  const t = el("div", "toast " + type, escapeHtml(msg));
  $("#toasts").appendChild(t);
  setTimeout(() => {
    t.style.transition = "opacity .3s, transform .3s";
    t.style.opacity = "0";
    t.style.transform = "translateY(8px)";
    setTimeout(() => t.remove(), 320);
  }, 2600);
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------------- Markdown 渲染（基于行的块解析） ----------------
   为什么不用正则一把梭：
   逐条正则替换会把列表项之间的空行变成 <br>，每个 <br> 撑出一整行，
   结果就是列表项之间出现巨大空隙。正确做法是先按"块"分组（列表、表格、
   引用、段落各自成块），块内再处理行内格式。
   ------------------------------------------------------------------ */

// 行内格式：粗体、行内代码、引用角标、链接
function mdInline(s) {
  if (!s) return "";
  let t = escapeHtml(s);
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\[(\d{1,2})\]/g, '<span class="cite">$1</span>');
  t = t.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+?)\*/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}

// 表格：首行表头 + 第二行分隔线 + 数据行
function mdTable(rows) {
  const cells = rows.map(r =>
    r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim())
  );
  let head = null;
  let body = cells;
  if (cells.length >= 2 && cells[1].every(c => /^:?-{2,}:?$/.test(c))) {
    head = cells[0];
    body = cells.slice(2);
  }
  let h = "<table>";
  if (head) h += "<thead><tr>" + head.map(c => `<th>${mdInline(c)}</th>`).join("") + "</tr></thead>";
  h += "<tbody>" + body
    .map(r => "<tr>" + r.map(c => `<td>${mdInline(c)}</td>`).join("") + "</tr>")
    .join("") + "</tbody>";
  // 外面套一层滚动容器，窄屏时表格可以横向滑动，不会把列压扁
  return `<div class="tbl">${h}</table></div>`;
}

function renderMarkdown(src) {
  if (!src) return "";
  const raw = String(src).replace(/\r\n/g, "\n");

  // 1) 围栏代码块先抠成占位符，避免里面的符号被当成格式
  const codes = [];
  const text = raw.replace(/```[^\n]*\n?([\s\S]*?)```/g, (m, code) => {
    const i = codes.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`) - 1;
    return `\u0000C${i}\u0000`;
  });

  const lines = text.split("\n");
  const out = [];
  let i = 0;

  const blank = (s) => !s || !s.trim();
  const RE_UL = /^\s*[-*+]\s+(.*)$/;
  const RE_OL = /^\s*(\d+)[.)]\s+(.*)$/;
  const RE_H  = /^\s{0,3}(#{1,6})\s+(.*)$/;
  const RE_HR = /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/;
  const RE_BQ = /^\s{0,3}>\s?(.*)$/;       // 块检测跑在未转义的原始行上，所以是 > 不是 &gt;
  const RE_TB = /^\s*\|/;
  const RE_PH = /^\u0000C(\d+)\u0000$/;

  // 列表项之间允许空行：往后跳过空行，如果还是列表项就继续收
  const skipBlankTo = (idx) => {
    let j = idx;
    while (j < lines.length && blank(lines[j])) j++;
    return j < lines.length ? j : -1;
  };

  // 识别一行是不是列表项，返回缩进层级和类型
  const asList = (ln) => {
    if (RE_H.test(ln) || RE_HR.test(ln) || RE_TB.test(ln) || RE_BQ.test(ln)) return null;
    let m = ln.match(/^(\s*)[-*+]\s+(.*)$/);
    if (m) return { indent: m[1].length, type: "ul", text: m[2] };
    m = ln.match(/^(\s*)(\d+)[.)]\s+(.*)$/);
    if (m) return { indent: m[1].length, type: "ol", text: m[3] };
    return null;
  };

  // 递归收集一个列表（支持嵌套），返回 {type, items:[{text, children:[...]}]}
  function parseList(baseIndent) {
    const first = asList(lines[i]);
    const type = first ? first.type : "ul";
    const items = [];

    while (i < lines.length) {
      if (blank(lines[i])) {
        const j = skipBlankTo(i);
        if (j > 0) {
          const nx = asList(lines[j]);
          if (nx && nx.indent >= baseIndent) { i = j; continue; }
        }
        break;
      }

      const cur = asList(lines[i]);
      if (!cur) {
        // 缩进的非列表行 → 并入上一项（列表项里的续行说明）
        if (items.length && /^\s{2,}\S/.test(lines[i])) {
          items[items.length - 1].text += " " + lines[i].trim();
          i++;
          continue;
        }
        break;
      }

      if (cur.indent < baseIndent) break;

      if (cur.indent > baseIndent) {
        // 更深一层 = 子列表
        if (items.length) {
          items[items.length - 1].children.push(parseList(cur.indent));
          continue;
        }
        break;
      }

      items.push({ text: cur.text, children: [] });
      i++;
    }
    return { type, items };
  }

  function renderList(node) {
    const kids = node.items.map(it => {
      const sub = it.children.map(renderList).join("");
      return `<li>${mdInline(it.text)}${sub}</li>`;
    }).join("");
    return `<${node.type}>${kids}</${node.type}>`;
  }

  while (i < lines.length) {
    const line = lines[i];

    if (blank(line)) { i++; continue; }

    // 代码块占位
    const ph = line.trim().match(RE_PH);
    if (ph) { out.push(codes[+ph[1]]); i++; continue; }

    // 标题
    let m = line.match(RE_H);
    if (m) {
      const lv = Math.min(m[1].length, 4);
      out.push(`<h${lv}>${mdInline(m[2])}</h${lv}>`);
      i++; continue;
    }

    // 分割线
    if (RE_HR.test(line)) { out.push("<hr>"); i++; continue; }

    // 表格
    if (RE_TB.test(line)) {
      const rows = [];
      while (i < lines.length && RE_TB.test(lines[i])) { rows.push(lines[i]); i++; }
      out.push(mdTable(rows));
      continue;
    }

    // 引用
    if (RE_BQ.test(line)) {
      const buf = [];
      while (i < lines.length && RE_BQ.test(lines[i])) {
        buf.push(lines[i].match(RE_BQ)[1]); i++;
      }
      out.push(`<blockquote>${buf.map(mdInline).join("<br>")}</blockquote>`);
      continue;
    }

    // 列表（支持一层或多层嵌套）
    if (RE_UL.test(line) || RE_OL.test(line)) {
      const baseIndent = line.match(/^\s*/)[0].length;
      out.push(renderList(parseList(baseIndent)));
      continue;
    }

    // 普通段落：一直吃到下一个块级标记或空行
    const para = [];
    while (i < lines.length && !blank(lines[i])
           && !RE_H.test(lines[i]) && !RE_HR.test(lines[i])
           && !RE_TB.test(lines[i]) && !RE_BQ.test(lines[i])
           && !RE_UL.test(lines[i]) && !RE_OL.test(lines[i])
           && !RE_PH.test(lines[i].trim())) {
      para.push(lines[i]); i++;
    }
    if (para.length) out.push(`<p>${para.map(mdInline).join("<br>")}</p>`);
    else i++;    // 兜底，防止死循环
  }

  // 2) 还原代码块（含行内出现的占位符）
  return out.join("\n").replace(/\u0000C(\d+)\u0000/g, (m, k) => codes[+k]);
}

async function checkHealth() {
  try {
    const h = await fetch("/api/health").then(r => r.json());
    const p = h.providers || {};
    if (h.ready) {
      $("#statusDot").className = "dot";
      $("#statusTxt").textContent = `已连接 · ${h.knowledge_base.chunks || 0} 条知识`;
      // 显示当前对话模型用的是哪家，换模型后一眼能看出来
      if (p.chat) {

        $("#modelTag").title =

          `向量：${p.embedding ? p.embedding.provider + " / " + p.embedding.model + " (" + p.embedding.dim + " 维)" : "?"}`;

/* ---------------- 消息渲染 ---------------- */
function hideWelcome() {
  const w = $("#welcome");
  if (w) w.remove();
}

function addUserMsg(text) {
  hideWelcome();
  const m = el("div", "msg user");
  m.innerHTML = `<div class="avatar">🙋</div>
    <div class="bubble-wrap"><div class="bubble">${renderMarkdown(text)}</div></div>`;
  $("#msgsInner").appendChild(m);
  scrollBottom();
  return m;
}

function addAiMsg() {
  const m = el("div", "msg ai");
  m.innerHTML = `<div class="avatar">🍳</div>
    <div class="bubble-wrap">
      <div class="bubble thinking">正在检索知识库…</div>
      <div class="sources"></div>
    </div>`;
  $("#msgsInner").appendChild(m);
  scrollBottom();
  return m;
}

function scrollBottom(force) {
  const box = $("#msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 180;
  if (near || force) box.scrollTop = box.scrollHeight;
}

/* ---------------- 发送 ---------------- */
async function send() {
  const input = $("#input");
  const text = input.value.trim();
  if (!text || S.streaming) return;

  input.value = "";
  input.style.height = "auto";
  addUserMsg(text);

  const aiNode = addAiMsg();
  const bubble = aiNode.querySelector(".bubble");
  const srcBox = aiNode.querySelector(".sources");

  S.streaming = true;
  setSendState(true);

  let acc = "";
  let sources = [];
  let firstDelta = true;
  let thinkChars = 0;   // 推理模型思考字数，只用于展示进度

  try {
    const ctrl = new AbortController();
    S.abort = ctrl;

    const res = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        conversation_id: S.convId,
        image_url: S.imageData,
      }),
      signal: ctrl.signal,
    });

    if (!res.ok || !res.body) throw new Error(`请求失败 HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const chunks = buf.split("\n\n");
      buf = chunks.pop();

      for (const chunk of chunks) {
        const line = chunk.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;

        let ev;
        try { ev = JSON.parse(payload); } catch (e) { continue; }

        switch (ev.type) {
          case "conversation":
            S.convId = ev.id;
            break;

          case "ingredients":
            bubble.classList.remove("thinking");
            bubble.innerHTML = `<div class="ingredients">${
              ev.text.split(/[、,，\s]+/).filter(Boolean)
                .map(x => `<span class="ing">${escapeHtml(x)}</span>`).join("")
            }</div>`;
            break;

          case "sources":
            sources = ev.sources || [];
            renderSources(srcBox, sources);
            break;

          case "thinking":
            // 推理模型会先思考一大段。这段不进正文，只用来告诉用户"它在干活"，
            // 否则空白屏幕会让人以为卡死了。
            thinkChars += (ev.text || "").length;
            if (firstDelta) {
              bubble.classList.remove("thinking");
              bubble.innerHTML =
                `<div class="thinkingbar"><span class="spinner"></span>` +
                `正在思考<span class="dots"></span>` +
                `<span class="thinkcnt">${thinkChars} 字</span></div>`;
              scrollBottom();
            }
            break;

          case "answer_start":
            if (firstDelta) {
              bubble.classList.remove("thinking");
              bubble.innerHTML = "";
              firstDelta = false;
            }
            break;

          case "delta":
            if (firstDelta) {
              bubble.classList.remove("thinking");
              bubble.innerHTML = "";
              firstDelta = false;
            }
            acc += ev.text;
            bubble.innerHTML = renderMarkdown(acc);
            scrollBottom();
            break;

          case "done":
            if (ev.citations && ev.citations.length) {
              highlightCited(bubble, ev.citations);
            }
            break;

          case "error":
            bubble.classList.remove("thinking");
            bubble.innerHTML = `<span style="color:var(--red)">⚠ ${escapeHtml(ev.message)}</span>`;
            break;
        }
      }
    }

    if (!acc) {
      bubble.classList.remove("thinking");
      bubble.innerHTML = `<span style="color:var(--txt-3)">（没有收到内容）</span>`;
    }
  } catch (err) {
    bubble.classList.remove("thinking");
    if (err.name === "AbortError") {
      bubble.innerHTML = (acc ? renderMarkdown(acc) : "") +
        `<p style="color:var(--txt-3);font-size:12px">（已停止）</p>`;
    } else {
      bubble.innerHTML = `<span style="color:var(--red)">⚠ ${escapeHtml(err.message)}</span>`;
    }
  } finally {
    S.streaming = false;
    S.abort = null;
    setSendState(false);
    S.imageData = null;
    clearImage();
    loadConvs();
    loadDocs();
    scrollBottom();
  }
}

function renderSources(box, sources) {
  box.innerHTML = "";
  if (!sources.length) return;

  sources.forEach(s => {
    const score = s.similarity;
    const cls = score >= 0.6 ? "hi" : (score >= 0.45 ? "mid" : "");
    const n = el("div", "src");
    n.innerHTML = `
      <div class="src-head">
        <span class="src-idx">${s.index}</span>
        <span class="src-name">《${escapeHtml(s.filename)}》</span>
        <span class="src-score ${cls}">${score.toFixed(2)}</span>
      </div>
      <div class="src-meta">${escapeHtml(s.label || "")}</div>
      <div class="src-prev">${escapeHtml(s.preview || "")}</div>`;
    box.appendChild(n);
  });
}

function highlightCited(bubble, citations) {
  const used = new Set(citations.map(c => c.index));
  bubble.querySelectorAll(".cite").forEach(c => {
    const idx = parseInt(c.textContent, 10);
    if (!used.has(idx)) {
      c.style.opacity = ".35";
      c.style.textDecoration = "line-through";
      c.title = "模型标注了但未实际使用";
    }
  });
}

function setSendState(streaming) {
  const btn = $("#btnSend");
  btn.classList.toggle("stop", streaming);
  btn.textContent = streaming ? "■" : "➤";
  btn.disabled = false;
}

/* ---------------- 会话操作 ---------------- */
function newChat() {
  S.convId = null;
  $("#chatTitle").textContent = "新对话";
  // 恢复欢迎页（不用整页刷新，避免闪白和重新拉数据）
  $("#msgsInner").innerHTML = WELCOME_HTML;
  bindChips();
  renderConvs();
  closeSidebar();
  $("#input").value = "";
  $("#input").style.height = "auto";
  clearImage();
  $("#input").focus();
}

function bindChips() {
  document.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => {
      $("#input").value = c.dataset.q;
      send();
    };
  });
}

async function openConv(id) {
  try {
    S.convId = id;
    const r = await api(`/chat/messages?conversation_id=${encodeURIComponent(id)}`);
    const list = r.data || [];

    $("#msgsInner").innerHTML = "";
    const c = S.convs.find(x => x.id === id);
    $("#chatTitle").textContent = c ? c.title : "对话";

    for (const m of list) {
      if (m.role === "user") {
        addUserMsg(m.content);
      } else {
        const n = el("div", "msg ai");
        n.innerHTML = `<div class="avatar">🍳</div>
          <div class="bubble-wrap">
            <div class="bubble">${renderMarkdown(m.content)}</div>
            <div class="sources"></div>
          </div>`;
        $("#msgsInner").appendChild(n);
        if (m.citations && m.citations.length) {
          renderSources(n.querySelector(".sources"), m.citations);
        }
      }
    }
    renderConvs();
    scrollBottom(true);
    closeSidebar();
  } catch (e) {
    toast(e.message, "err");
  }
}

async function deleteConv(id) {
  try {
    await api(`/chat/conversations/${id}`, { method: "DELETE" });
    if (S.convId === id) { S.convId = null; $("#chatTitle").textContent = "新对话"; }
    await loadConvs();
    toast("已删除对话");
  } catch (e) { toast(e.message, "err"); }
}

/* ---------------- 知识库操作 ---------------- */
async function uploadFile(file) {
  if (!file) return;
  const ok = /\.(txt|md|markdown|pdf|docx|csv|json)$/i.test(file.name);
  if (!ok) { toast("不支持的文件类型", "err"); return; }

  const drop = $("#drop");
  drop.classList.add("busy");
  drop.querySelector(".t").textContent = "解析并向量化中…";
  toast(`正在处理 ${file.name}`);

  try {
    const fd = new FormData();
    fd.append("file", file);
    const r = await api("/kb/upload", { method: "POST", body: fd });
    const d = r.data;
    toast(`已入库「${d.filename}」共 ${d.chunks} 个片段`, "ok");
    await loadDocs();
    checkHealth();
  } catch (e) {
    toast("入库失败：" + e.message, "err");
  } finally {
    drop.classList.remove("busy");
    drop.querySelector(".t").textContent = "点击或拖入文件";
    $("#fileInput").value = "";
  }
}

async function deleteDoc(sid, name) {
  if (!confirm(`确认从知识库删除「${name}」？`)) return;
  try {
    await api(`/kb/sources/${sid}`, { method: "DELETE" });
    toast("已删除");
    await loadDocs();
    checkHealth();
  } catch (e) { toast(e.message, "err"); }
}

/* ---------------- 图片 ---------------- */
function clearImage() {
  S.imageData = null;
  $("#imgPreview").classList.remove("on");
  $("#imgPreviewEl").src = "";
}

function handleImage(file) {
  if (!file || !file.type.startsWith("image/")) { toast("请选择图片文件", "err"); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    // 压缩到最长边 900px，避免 base64 过大撑爆请求
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let { width, height } = img;
      if (width > max || height > max) {
        const r = Math.min(max / width, max / height);
        width = Math.round(width * r);
        height = Math.round(height * r);
      }
      const cv = document.createElement("canvas");
      cv.width = width; cv.height = height;
      cv.getContext("2d").drawImage(img, 0, 0, width, height);
      S.imageData = cv.toDataURL("image/jpeg", 0.85);
      $("#imgPreviewEl").src = S.imageData;
      $("#imgPreview").classList.add("on");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- 侧栏开合 ---------------- */
function openSidebar() {
  $("#sidebar").classList.add("open");
  $("#backdrop").classList.add("on");
}
function closeSidebar() {
  $("#sidebar").classList.remove("open");
  $("#backdrop").classList.remove("on");
}

/* ---------------- 事件绑定 ---------------- */
function bind() {
  const input = $("#input");

  // 自适应高度
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 190) + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      S.streaming ? null : send();
    }
  });

  $("#btnSend").onclick = () => {
    if (S.streaming && S.abort) { S.abort.abort(); return; }
    send();
  };

  $("#btnNew").onclick = newChat;
  $("#btnMenu").onclick = () => {
    const sb = $("#sidebar");
    if (window.innerWidth <= 760) {
      sb.classList.contains("open") ? closeSidebar() : openSidebar();
    } else {
      sb.classList.toggle("collapsed");
    }
  };
  $("#backdrop").onclick = closeSidebar;

  // 知识库上传
  $("#drop").onclick = () => $("#fileInput").click();
  $("#fileInput").onchange = (e) => uploadFile(e.target.files[0]);

  const drop = $("#drop");
  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if (f) uploadFile(f);
  });

  // 图片
  $("#btnImg").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.onchange = (e) => handleImage(e.target.files[0]);
    inp.click();
  };
  $("#btnRmImg").onclick = clearImage;

  // 输入框整体支持拖图片
  const comp = $("#composer");
  comp.addEventListener("dragover", e => { e.preventDefault(); comp.classList.add("drag"); });
  comp.addEventListener("dragleave", () => comp.classList.remove("drag"));
  comp.addEventListener("drop", e => {
    e.preventDefault();
    comp.classList.remove("drag");
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith("image/")) handleImage(f);
  });

  // 示例问题
  bindChips();
}

/* ---------------- 启动 ---------------- */
async function boot() {
  bind();
  // 记下欢迎页原始结构，新建对话时用它还原
  WELCOME_HTML = $("#msgsInner").innerHTML;
  await Promise.all([loadConvs(), loadDocs(), loadFacts(), checkHealth()]);
  $("#input").focus();

  // 每 30 秒刷新一次状态灯
  setInterval(checkHealth, 30000);
}

document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
